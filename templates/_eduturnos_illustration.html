                <defs>

                        <stop offset="100%" stop-color="#367fbd"/>

                    <filter id="edCompactShadow" x="-30%" y="-30%" width="160%" height="170%">
                        <feDropShadow
                            dx="0"
                            dy="10"
                            stdDeviation="12"
                            flood-color="#557899"
                            flood-opacity=".16"/>
                    </filter>

                    <filter id="edCompactSoft" x="-30%" y="-30%" width="160%" height="170%">
                        <feDropShadow
                            dx="0"
                            dy="5"
                            stdDeviation="7"
                            flood-color="#557899"
