{% extends 'base.html' %}{% from '_hora_cita.html' import selector_hora %}{% block content %}<div class="page-head nueva-cita-heading"><h1>Nueva citación</h1></div><form method="post" class="panel form-grid nueva-cita-form">{{ csrf_field()|safe }}<input type="hidden" name="vista_movil" value="1" data-mobile-only disabled>
{% if periodos %}<input type="hidden" name="id_periodo" value="{{ periodos[0].id }}">{% endif %}
<label class="citation-student-field">Estudiante<select class="citation-student-select" name="id_estudiante" required>
<option value="" selected disabled hidden></option>
{% for e in estudiantes %}<option value="{{ e.id_estudiante }}">{{ e.nombre }}{% if e.grado %} — {{ e.grado }}{% endif %}{% if e.jornada %} · {{ e.jornada }}{% endif %}</option>{% endfor %}</select></label>
<label>Docente<select name="id_docente" required>
<option value="" selected disabled hidden></option>
{% for d in docentes %}<option value="{{ d.id_docente }}">{{ d.nombre }}{% if d.grado %} — {{ d.grado }}{% endif %}{% if d.jornada %} · {{ d.jornada }}{% endif %}</option>{% endfor %}</select></label>
<label>Acudiente<select name="id_acudiente" required>
<option value="" selected disabled hidden></option>
{% for a in acudientes %}<option value="{{ a.id_acudiente }}">{{ a.nombre }}{% if a.grado %} — {{ a.grado }}{% endif %}{% if a.jornada %} · {{ a.jornada }}{% endif %}</option>{% endfor %}</select></label>
<label>Motivo<select name="id_motivo" required>
<option value="" selected disabled hidden></option>
{% for m in motivos %}<option value="{{ m.id }}">{{ m.nombre }}</option>{% endfor %}</select></label>
<label>Fecha<input type="date" name="fecha" min="{{ fecha_minima }}" required></label><label>Hora{{ selector_hora('hora') }}</label>
<div class="full-field mobile-command-group"><button class="boton" type="submit">Crear citación</button> <button class="boton secundario" type="reset">Cancelar</button></div></form>



{% endblock %}
