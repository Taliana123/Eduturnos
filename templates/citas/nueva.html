{% extends 'base.html' %}
{% from '_hora_cita.html' import selector_hora %}
{% block content %}
<div class="page-head nueva-cita-heading"><div class="menu-page-heading"><div class="menu-page-heading-copy"><h1>Nueva citación</h1></div></div></div>
<form method="post" class="panel form-grid nueva-cita-form" data-cita-form data-creator-role="{{ usuario.rol_nombre }}">
  {{ csrf_field()|safe }}
  <input type="hidden" name="vista_movil" value="1" data-mobile-only disabled>
  {% if periodos %}<input type="hidden" name="id_periodo" value="{{ periodos[0].id }}">{% endif %}

  <label>Tipo de destinatario
    <select name="destinatario_tipo" id="destinatario-tipo" required>
      <option value="Estudiante" selected>Estudiante</option>
      {% if usuario.rol_nombre in ['Super Admin','Rector'] %}<option value="Docente">Docente</option>{% endif %}
      {% if usuario.rol_nombre in ['Administrador / Coordinador','Docente'] %}<option value="Rector">Rector</option>{% endif %}
      {% if usuario.rol_nombre == 'Docente' %}<option value="Administrador / Coordinador">Coordinación</option>{% endif %}
    </select>
  </label>

  <label class="full-field" data-personal-target hidden>Destinatario institucional
    <select name="destinatario_usuario_id" id="destinatario-personal" disabled>
      <option value="" selected disabled>Selecciona la persona</option>
      {% for persona in personal_destinatarios %}
      <option value="{{ persona.id_usuario }}" data-role="{{ persona.rol_nombre }}" data-docente="{{ persona.id_docente or '' }}">{{ persona.nombres }} {{ persona.apellidos }} · {{ persona.rol_nombre }}</option>
      {% endfor %}
    </select>
  </label>

  <label class="full-field" data-student-search>Buscar estudiante por número de documento
    <input type="search" id="buscar-documento-estudiante" inputmode="numeric" autocomplete="off" placeholder="Escribe el documento del estudiante">
  </label>
  <label class="citation-student-field" data-student-field>Estudiante
    <select class="citation-student-select" name="id_estudiante" id="estudiante-select">
      <option value="" selected disabled>Selecciona el estudiante</option>
      {% for e in estudiantes %}<option value="{{ e.id_estudiante }}" data-documento="{{ e.documento }}" data-acudiente="{{ e.acudiente_principal_id or '' }}">{{ e.nombre }} · Documento {{ e.documento }}{% if e.grado %} — {{ e.grado }}{% endif %}{% if e.jornada %} · {{ e.jornada }}{% endif %}</option>{% endfor %}
    </select>
  </label>
  <label data-teacher-field>Docente participante<select name="id_docente" id="docente-select">
    <option value="" {% if usuario.rol_nombre == 'Docente' %}disabled{% endif %} selected>Sin docente adicional</option>
    {% for d in docentes %}<option value="{{ d.id_docente }}" {% if d.id_docente == mi_docente_id %}selected{% endif %}>{{ d.nombre }}{% if d.grado %} — {{ d.grado }}{% endif %}{% if d.jornada %} · {{ d.jornada }}{% endif %}</option>{% endfor %}
  </select>
  {% if usuario.rol_nombre == 'Docente' %}<input type="hidden" name="docente_obligatorio" value="1">{% endif %}
  </label>
  <label data-guardian-field>Acudiente<select name="id_acudiente" id="acudiente-select">
    <option value="" selected disabled>Selecciona el acudiente</option>
    {% for a in acudientes %}<option value="{{ a.id_acudiente }}">{{ a.nombre }}{% if a.grado %} — {{ a.grado }}{% endif %}{% if a.jornada %} · {{ a.jornada }}{% endif %}</option>{% endfor %}
  </select></label>
  <label>Motivo<select name="id_motivo" required><option value="" selected disabled></option>{% for m in motivos %}<option value="{{ m.id }}">{{ m.nombre }}</option>{% endfor %}</select></label>
  <label>Fecha<input type="date" name="fecha" min="{{ fecha_minima }}" required></label>
  <label>Hora{{ selector_hora('hora') }}</label>
  <div class="full-field mobile-command-group"><button class="boton" type="submit">Crear citación</button> <button class="boton secundario" type="reset">Cancelar</button></div>
</form>
<script>
(() => {
  const form = document.querySelector('[data-cita-form]');
  if (!form) return;
  const type = form.querySelector('#destinatario-tipo');
  const personalWrap = form.querySelector('[data-personal-target]');
  const personal = form.querySelector('#destinatario-personal');
  const search = form.querySelector('#buscar-documento-estudiante');
  const student = form.querySelector('#estudiante-select');
  const guardian = form.querySelector('#acudiente-select');
  const teacher = form.querySelector('#docente-select');
  const creatorRole = form.dataset.creatorRole;
  const studentFields = [...form.querySelectorAll('[data-student-field], [data-student-search], [data-guardian-field]')];
  const teacherWrap = form.querySelector('[data-teacher-field]');

  function applyType() {
    const isStudent = type.value === 'Estudiante';
    personalWrap.hidden = isStudent;
    personal.disabled = isStudent;
    personal.required = !isStudent;
    studentFields.forEach((el) => { el.hidden = !isStudent; });
    student.disabled = !isStudent;
    guardian.disabled = !isStudent;
    student.required = isStudent;
    guardian.required = isStudent;
    search.disabled = !isStudent;
    teacherWrap.hidden = !isStudent;
    teacher.disabled = !isStudent;
    teacher.required = isStudent && creatorRole === 'Docente';
    if (!isStudent) { student.value = ''; guardian.value = ''; }
    else personal.value = '';
    filterStudents();
  }
  function filterStudents() {
    const digits = search.value.replace(/\D/g, '');
    const options = [...student.options].slice(1);
    options.forEach((option) => {
      const match = !digits || (option.dataset.documento || '').includes(digits);
      option.hidden = !match;
    });
  }
  student.addEventListener('change', () => {
    const option = student.selectedOptions[0];
    if (option && option.dataset.acudiente && guardian.querySelector(`option[value="${option.dataset.acudiente}"]`)) guardian.value = option.dataset.acudiente;
  });
  search.addEventListener('input', () => {
    student.value = '';
    guardian.value = '';
    filterStudents();
  });
  type.addEventListener('change', applyType);
  personal.addEventListener('change', () => {
    const option = personal.selectedOptions[0];
    if (option && option.dataset.role === 'Docente' && option.dataset.docente) teacher.value = option.dataset.docente;
  });
  form.addEventListener('reset', () => setTimeout(applyType, 0));
  applyType();
})();
</script>
{% endblock %}
