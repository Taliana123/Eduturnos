{% if usuario_navegacion %}
<section class="dashboard-help" aria-label="Ayuda y soporte">
    <button class="assistant-sidebar-entry assistant-sidebar-card" type="button" data-assistant-toggle data-assistant-open aria-controls="assistant-chat-panel" aria-expanded="false" aria-label="Abrir Ayuda EDUTURNOS" title="Abrir Ayuda EDUTURNOS">
        <img class="assistant-sidebar-avatar" src="{{ url_for('static', filename='icons/edubot.png') }}" alt="" width="40" height="40">
        <span class="assistant-sidebar-copy">
            <strong>Ayuda EDUTURNOS</strong>
            <small>Pregunta a EDUBOT</small>
        </span>
    </button>
    <div class="dashboard-help-chat" id="assistant-chat-panel" data-eduturnos-assistant data-endpoint="{{ url_for('asistente.preguntar') }}" data-csrf="{{ csrf_token() }}" hidden>
        <header class="assistant-header" title="Arrastra este encabezado para mover el chat">
            <img class="assistant-avatar" src="{{ url_for('static', filename='icons/edubot.png') }}" alt="Muñeco de EDUBOT" width="48" height="48">
            <span class="assistant-brand">
                <strong id="dashboard-help-title">EDUBOT</strong>
                <small>Respuesta inmediata a tus dudas</small>
            </span>
            <div class="assistant-actions">
                <button class="assistant-toggle-button" type="button" data-assistant-toggle data-assistant-close aria-controls="assistant-chat-panel" aria-expanded="true" aria-label="Cerrar Ayuda EDUTURNOS" title="Cerrar Ayuda EDUTURNOS">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18" /></svg>
                </button>
            </div>
        </header>

        <div class="assistant-chat-body" id="assistant-chat-body" data-assistant-body>
            <div class="assistant-messages" data-assistant-messages role="log" aria-live="polite" aria-relevant="additions">
                <p class="assistant-answer" data-assistant-greeting>¡Hola{% if usuario_navegacion.nombres|default('') %}, {{ usuario_navegacion.nombres }}{% endif %}! Soy EDUBOT. ¿En qué puedo ayudarte hoy?</p>
            </div>

            <form class="assistant-composer">
                <textarea id="assistant-question" rows="1" maxlength="1200" aria-label="Mensaje para EDUBOT" placeholder="Mensaje para EDUBOT…" autocomplete="off"></textarea>
                <button type="submit" aria-label="Enviar pregunta" disabled>
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12 20 4l-5 16-3-7-8-1Zm8 1 8-9" /></svg>
                </button>
            </form>
            <p class="assistant-status" data-assistant-status aria-live="polite"></p>
            <small class="assistant-privacy">Por tu seguridad, no compartas información personal ni documentos.</small>
        </div>
        <button class="assistant-resize-handle assistant-resize-nw" type="button" data-assistant-resize="nw" aria-label="Cambiar tamaño desde la esquina superior izquierda"></button>
        <button class="assistant-resize-handle assistant-resize-ne" type="button" data-assistant-resize="ne" aria-label="Cambiar tamaño desde la esquina superior derecha"></button>
        <button class="assistant-resize-handle assistant-resize-sw" type="button" data-assistant-resize="sw" aria-label="Cambiar tamaño desde la esquina inferior izquierda"></button>
        <button class="assistant-resize-handle assistant-resize-se" type="button" data-assistant-resize="se" aria-label="Cambiar tamaño desde la esquina inferior derecha"></button>
    </div>
</section>
{% endif %}
