<section class="eduturnos-share-card" aria-labelledby="share-card-title">
    <h2 id="share-card-title">Escanea y comparte</h2>
    <label class="eduturnos-qr-picker">
        <span>Diseño del código QR</span>
        <select data-qr-style aria-label="Elegir diseño del código QR">
            <option value="blue">Azul EDUTURNOS</option>
            <option value="navy">Azul institucional</option>
        </select>
    </label>
    <div class="eduturnos-share-qr-frame" data-qr-frame>
        <span class="eduturnos-qr-corner eduturnos-qr-corner--top-left" aria-hidden="true"></span>
        <span class="eduturnos-qr-corner eduturnos-qr-corner--top-right" aria-hidden="true"></span>
        <span class="eduturnos-qr-corner eduturnos-qr-corner--bottom-left" aria-hidden="true"></span>
        <span class="eduturnos-qr-corner eduturnos-qr-corner--bottom-right" aria-hidden="true"></span>
        <span class="eduturnos-qr-frame-label eduturnos-qr-frame-label--top"><span aria-hidden="true">✓</span> QR EDUTURNOS</span>
        <div class="eduturnos-qr-code">
        <img
            src="{{ url_for('compartir_qr_eduturnos') }}?v=4"
            data-qr-blue="{{ url_for('compartir_qr_eduturnos') }}?v=4"
            data-qr-navy="{{ url_for('compartir_qr_eduturnos') }}?estilo=navy&amp;v=1"
            alt="Código QR azul de EDUTURNOS para abrir el sitio oficial"
            width="260"
            height="260"
        >
        </div>
        <span class="eduturnos-qr-frame-label eduturnos-qr-frame-label--bottom">ESCANEA PARA ABRIR EDUTURNOS</span>
    </div>
    <p class="eduturnos-share-description" data-qr-description>Escanea el código para abrir EDUTURNOS e iniciar sesión.</p>
    <button class="eduturnos-share-button" type="button" data-share-eduturnos>
        <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M12 16V4m0 0L7 9m5-5 5 5M5 13v6h14v-6"/></svg>
        <span>Compartir EDUTURNOS</span>
    </button>
    <p class="eduturnos-share-status" data-share-status role="status" aria-live="polite"></p>
</section>
