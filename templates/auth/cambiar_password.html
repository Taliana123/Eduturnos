{% extends 'base.html' %}{% block title %}Cambiar contraseña · EDUTURNOS{% endblock %}{% block content %}
<section class="formulario"><div class="tarjeta form-card">
  <div class="form-top-actions"><a class="password-account-back" href="{{ url_for('cuenta.index') }}">← Mi cuenta</a></div>
  <div class="section-heading"><span class="badge">Seguridad</span><h1>Cambiar contraseña</h1><p>Usa una contraseña de mínimo 12 caracteres con mayúsculas, minúsculas y números.</p></div>
  <form method="post" class="stack-form">{{ csrf_field()|safe }}
    <label>Contraseña actual<input type="password" name="password_actual" required autocomplete="current-password"></label>
    <label>Contraseña nueva<input type="password" name="password_nueva" minlength="12" required autocomplete="new-password"></label>
    <label>Confirmar contraseña<input type="password" name="password_confirmacion" minlength="12" required autocomplete="new-password"></label>
    <button class="boton boton-full" type="submit">Actualizar contraseña</button>
  </form>
</div></section>



{% endblock %}
