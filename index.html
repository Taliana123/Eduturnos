<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>EDUTURNOS - Inicio de sesión</title>

    <link rel="stylesheet" href="css/estilos.css">
</head>

<body>

    <div class="login">

        <h1>EDUTURNOS</h1>

        <h2>Inicio de sesión</h2>

        <form action="php/login.php" method="POST">

            <label>Correo</label>

            <input type="email"
                   name="correo"
                   required>

            <label>Contraseña</label>

            <input type="password"
                   name="contrasena"
                   required>

            <button type="submit">
                Ingresar
            </button>

        </form>

    </div>

</body>
</html>
