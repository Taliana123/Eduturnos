<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>EDUTURNOS - Iniciar sesión</title>

    <link rel="stylesheet" href="css/estilos.css">
</head>

<body>

    <main class="contenedor-auth">

        <section class="tarjeta-auth">

            <h1>EDUTURNOS</h1>

            <h2>Iniciar sesión</h2>

            <p>
                Ingresa con tu documento y contraseña.
            </p>

            <form id="formLogin">

                <label for="documento">
                    Documento
                </label>

                <input
                    type="text"
                    id="documento"
                    name="documento"
                    required
                >

                <label for="contrasena">
                    Contraseña
                </label>

                <input
                    type="password"
                    id="contrasena"
                    name="contrasena"
                    required
                >

                <button type="submit">
                    Ingresar
                </button>

            </form>

            <div id="mensajeLogin"></div>

            <p>
                ¿No tienes una cuenta?
                <a href="registro.html">
                    Registrarse
                </a>
            </p>

        </section>

    </main>

    <script src="js/autenticacion.js"></script>

</body>

</html>
