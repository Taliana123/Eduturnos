<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>EDUTURNOS - Verificación</title>

    <link rel="stylesheet" href="css/estilos.css">

</head>

<body>

<main class="contenedor-auth">

<section class="tarjeta-auth">

    <h1>EDUTURNOS</h1>

    <h2>Verificar cuenta</h2>

    <p>
        Ingresa el documento y el código recibido.
    </p>

    <form id="formVerificar">

        <label>
            Documento
        </label>

        <input
            type="text"
            name="documento"
            required
        >

        <label>
            Código
        </label>

        <input
            type="text"
            name="codigo"
            maxlength="6"
            required
        >

        <button type="submit">
            Verificar
        </button>

    </form>

    <div id="mensajeVerificar"></div>

    <p>
        <a href="login.html">
            Volver al inicio de sesión
        </a>
    </p>

</section>

</main>

<script src="js/autenticacion.js"></script>

</body>

</html>
