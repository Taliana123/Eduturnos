<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>EDUTURNOS - Registro</title>

    <link rel="stylesheet" href="css/estilos.css">

</head>

<body>

<main class="contenedor-auth">

<section class="tarjeta-auth">

    <h1>EDUTURNOS</h1>

    <h2>Crear cuenta</h2>

    <form id="formRegistro">

        <label>Tipo de documento</label>

        <select
            name="tipo_documento"
            required
        >

            <option value="">
                Seleccione
            </option>

            <option value="CC">
                Cédula de ciudadanía
            </option>

            <option value="TI">
                Tarjeta de identidad
            </option>

            <option value="CE">
                Cédula de extranjería
            </option>

        </select>


        <label>Documento</label>

        <input
            type="text"
            name="documento"
            required
        >


        <label>Nombres</label>

        <input
            type="text"
            name="nombres"
            required
        >


        <label>Apellidos</label>

        <input
            type="text"
            name="apellidos"
            required
        >


        <label>Correo</label>

        <input
            type="email"
            name="correo"
            required
        >


        <label>Teléfono</label>

        <input
            type="text"
            name="telefono"
        >


        <label>Contraseña</label>

        <input
            type="password"
            name="contrasena"
            required
            minlength="6"
        >


        <label>Confirmar contraseña</label>

        <input
            type="password"
            name="confirmar_contrasena"
            required
            minlength="6"
        >


        <button type="submit">
            Registrarme
        </button>

    </form>

    <div id="mensajeRegistro"></div>

    <p>
        ¿Ya tienes cuenta?
        <a href="login.html">
            Iniciar sesión
        </a>
    </p>

</section>

</main>

<script src="js/autenticacion.js"></script>

</body>

</html>
