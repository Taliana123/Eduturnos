<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Crear citación - EDUTURNOS</title>

    <link rel="stylesheet" href="css/estilos.css">

</head>

<body>

<main class="contenedor">

    <h1>Crear citación</h1>

    <form id="formCrearCita">

        <label>Estudiante</label>

        <select
            id="id_estudiante"
            name="id_estudiante"
            required
        >

            <option value="">
                Seleccione estudiante
            </option>

        </select>


        <label>Acudiente</label>

        <select
            id="id_acudiente"
            name="id_acudiente"
            required
        >

            <option value="">
                Seleccione acudiente
            </option>

        </select>


        <label>Docente</label>

        <select
            id="id_docente"
            name="id_docente"
            required
        >

            <option value="">
                Seleccione docente
            </option>

        </select>


        <label>Motivo</label>

        <select
            id="id_motivo"
            name="id_motivo"
            required
        >

            <option value="">
                Seleccione motivo
            </option>

        </select>


        <label>Fecha</label>

        <input
            type="date"
            name="fecha"
            required
        >


        <label>Hora</label>

        <input
            type="time"
            name="hora"
            required
        >


        <label>Lugar</label>

        <input
            type="text"
            name="lugar"
            maxlength="150"
        >


        <label>Observaciones</label>

        <textarea
            name="observaciones"
            rows="4"
        ></textarea>


        <button type="submit">
            Crear citación
        </button>

    </form>

    <div id="mensajeCita"></div>

</main>

<script src="js/citaciones.js"></script>

</body>

</html>
