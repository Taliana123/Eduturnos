<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>EDUTURNOS - Dashboard</title>

    <link rel="stylesheet"
          href="css/estilos.css">
</head>

<body>

    <!-- Encabezado principal -->
    <header class="topbar">

        <div class="logo">
            EDUTURNOS
        </div>

        <div class="usuario">
            <span>Usuario</span>

            <button id="btnCerrarSesion">
                Salir
            </button>
        </div>

    </header>


    <!-- Estructura principal -->
    <div class="layout">

        <!-- Menú lateral -->
        <aside class="sidebar">

            <nav>

                <a href="dashboard.html">
                    Inicio
                </a>

                <a href="#">
                    Citaciones
                </a>

                <a href="#">
                    Estudiantes
                </a>

                <a href="#">
                    Acudientes
                </a>

                <a href="#">
                    Docentes
                </a>

                <a href="#">
                    Notificaciones
                </a>

                <a href="#">
                    Reportes
                </a>

                <a href="#">
                    Configuración
                </a>

            </nav>

        </aside>


        <!-- Contenido principal -->
        <main class="contenido">

            <h1>
                Dashboard
            </h1>

            <p class="bienvenida">
                Bienvenido a EDUTURNOS
            </p>


            <!-- Tarjetas de estadísticas -->
            <section class="estadisticas">

                <article class="tarjeta">

                    <h2>
                        Citas de hoy
                    </h2>

                    <p id="citasHoy">
                        0
                    </p>

                </article>


                <article class="tarjeta">

                    <h2>
                        Pendientes
                    </h2>

                    <p id="pendientes">
                        0
                    </p>

                </article>


                <article class="tarjeta">

                    <h2>
                        Confirmadas
                    </h2>

                    <p id="confirmadas">
                        0
                    </p>

                </article>


                <article class="tarjeta">

                    <h2>
                        Realizadas
                    </h2>

                    <p id="realizadas">
                        0
                    </p>

                </article>

            </section>


            <!-- Próximas citaciones -->
            <section class="panel">

                <h2>
                    Próximas citaciones
                </h2>

                <div id="listaCitaciones">

                    <p>
                        No hay citaciones registradas.
                    </p>

                </div>

            </section>

        </main>

    </div>


    <!-- JavaScript -->
    <script src="js/app.js"></script>

</body>

</html>
